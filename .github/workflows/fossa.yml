name: FOSSA Scan

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  fossa-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (if needed)
        # optional: install language deps so FOSSA can detect packages (uncomment and adapt)
        # run: |
        #   npm ci
        #   # or for Python: pip install -r requirements.txt
        shell: bash

      - name: Install FOSSA CLI
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash

      - name: Authenticate FOSSA CLI
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          # Use the API key from the GitHub secret
          fossa auth login --api-key "$FOSSA_API_KEY"

      - name: Run FOSSA analyze and upload results
        run: |
          # analyze will detect dependencies; --upload sends results to your FOSSA project dashboard
          fossa analyze --upload

      - name: Run FOSSA tests (fail on violations)
        run: |
          # fossa test will exit non-zero when policy violations are found, failing the job
          fossa test
