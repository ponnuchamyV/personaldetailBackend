name: FOSSA License Scan

on:
  push:
    branches: [ main, master, sam ]
  pull_request:
  workflow_dispatch:

jobs:
  fossa:
    runs-on: ubuntu-latest
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}   # provide API key via env (do NOT hardcode)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download dependencies (go-offline)
        run: mvn -B -DskipTests dependency:go-offline

      - name: Build project (skip tests)
        run: mvn -B -DskipTests package

      - name: Install FOSSA CLI
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash

      - name: Debug: confirm FOSSA_API_KEY is present
        run: |
          if [ -z "${FOSSA_API_KEY:-}" ]; then
            echo "FOSSA_API_KEY is NOT SET"
            exit 1
          else
            echo "FOSSA_API_KEY is present (length: $(echo -n "$FOSSA_API_KEY" | wc -c) bytes)"
          fi

      - name: Run FOSSA analysis and upload
        run: |
          # CLI will use FOSSA_API_KEY env variable automatically
          fossa analyze --upload

      - name: Verify License Compliance
        run: |
          fossa test
